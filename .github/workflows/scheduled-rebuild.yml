name: LinkedIn Posts Sync — Vercel Rebuild

# ── Triggers ───────────────────────────────────────────────────────────────────
on:
  schedule:
    # Mon, Wed, Fri at 4:00 UTC (9:30am IST)
    # Adjust the cron expression to change the schedule:
    #   '0 4 * * 1'     → Monday only
    #   '0 4 * * 1,3,5' → Mon + Wed + Fri
    #   '0 4 * * *'     → Daily
    - cron: '0 4 * * 1,3,5'

  # Allow manually triggering from the GitHub Actions UI (Actions tab → Run workflow)
  workflow_dispatch:

# ── Jobs ───────────────────────────────────────────────────────────────────────
jobs:
  trigger-vercel-build:
    name: Trigger Vercel Rebuild
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          echo "Triggering Vercel build at $(date -u)"
          # Vercel deploy hooks respond with HTTP 201 Created on success
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          echo "Vercel responded with HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "201" ]; then
            echo "❌ Vercel deploy hook returned unexpected status: $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Vercel build triggered successfully"
